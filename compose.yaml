services:
  postgres:
    image: pgvector/pgvector:pg18

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  bronze:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    working_dir: /app

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres

    restart: "no"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - /app/bronze/main.py

  silver:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy
      bronze:
        condition: service_completed_successfully

    working_dir: /app

    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres

    restart: "no"

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - /app/silver/main.py

volumes:
  postgres_data:
  hf_cache:
