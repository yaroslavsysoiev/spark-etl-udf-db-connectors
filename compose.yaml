services:
  postgres:
    image: postgres:18
    container_name: spark-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sparkdb
      POSTGRES_USER: sparkuser
      POSTGRES_PASSWORD: mypassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: